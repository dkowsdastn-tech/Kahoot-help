services:
  - type: web
    name: winner-ai
    runtime: node
    plan: free
    buildCommand: npm install --ignore-scripts
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_PASSWORD
        generateValue: true
